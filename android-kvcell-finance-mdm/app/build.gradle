plugins { id 'com.android.application' }

android {
    namespace 'br.com.kvcell.mdmd'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.kvcell.finance.mdm'
        minSdk 26
        targetSdk 35
        versionCode 1000
        versionName '1000.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
