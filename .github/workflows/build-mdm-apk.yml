
name: Build KV CELL MDM APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-kvcell-finance-mdm/**'
      - '.github/workflows/build-mdm-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p android-kvcell-finance-mdm :app:assembleDebug

      - name: Preparar APK
        run: |
          mkdir -p output
          cp android-kvcell-finance-mdm/app/build/outputs/apk/debug/app-debug.apk output/KV_CELL_MDM.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: KV_CELL_MDM
          path: output/KV_CELL_MDM.apk
          if-no-files-found: error
          retention-days: 30
