
name: Build KV CELL MDM APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-kvcell-finance-mdm/**'
      - '.github/workflows/blank.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar Debug
        run: |
          gradle --no-daemon --stacktrace \
            -p android-kvcell-finance-mdm \
            :app:assembleDebug

      - name: Compilar Release
        run: |
          gradle --no-daemon --stacktrace \
            -p android-kvcell-finance-mdm \
            :app:assembleRelease

      - name: Preparar APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          DEBUG="android-kvcell-finance-mdm/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE="android-kvcell-finance-mdm/app/build/outputs/apk/release/app-release.apk"
          UNSIGNED="android-kvcell-finance-mdm/app/build/outputs/apk/release/app-release-unsigned.apk"

          test -f "$DEBUG" || {
            echo "::error::APK Debug não encontrado."
            exit 1
          }

          cp "$DEBUG" output/KV_CELL_MDM_DEBUG.apk

          if [ -f "$RELEASE" ]; then
            cp "$RELEASE" output/KV_CELL_MDM_RELEASE.apk
          elif [ -f "$UNSIGNED" ]; then
            cp "$UNSIGNED" output/KV_CELL_MDM_RELEASE_UNSIGNED.apk
          else
            echo "::error::APK Release não encontrado."
            find android-kvcell-finance-mdm/app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi

          ls -lh output/

      - name: Disponibilizar APKs
        uses: actions/upload-artifact@v4
        with:
          name: KV_CELL_MDM_APKS
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
