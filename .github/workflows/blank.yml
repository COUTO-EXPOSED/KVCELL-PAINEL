name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Garantir configuracoes do AndroidX e Jetifier em todos os locais
        shell: bash
        run: |
          # Cria ou atualiza o gradle.properties tanto na raiz quanto na pasta do projeto Android
          for DIR in "." "android-kvcell-finance-mdm"; do
            PROPS_FILE="$DIR/gradle.properties"
            mkdir -p "$DIR"
            
            # Remove entradas antigas se existirem para evitar duplicidade
            [ -f "$PROPS_FILE" ] && sed -i '/android.useAndroidX/d' "$PROPS_FILE"
            [ -f "$PROPS_FILE" ] && sed -i '/android.enableJetifier/d' "$PROPS_FILE"
            
            # Adiciona as configurações do AndroidX e Jetifier
            echo "android.useAndroidX=true" >> "$PROPS_FILE"
            echo "android.enableJetifier=true" >> "$PROPS_FILE"
          done

          # Verificação para confirmar a criação correta
          echo "--- Conteúdo do gradle.properties na raiz ---"
          cat ./gradle.properties
          echo "--- Conteúdo do gradle.properties no projeto ---"
          cat ./android-kvcell-finance-mdm/gradle.properties

      - name: Dar permissão de execução ao Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./android-kvcell-finance-mdm/gradlew" ]; then
            chmod +x ./android-kvcell-finance-mdm/gradlew
          fi

      - name: Compilar APK (Debug)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            cd android-kvcell-finance-mdm
            ./gradlew assembleDebug
          fi

      - name: Salvar artefato do APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
