name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Localizar pasta do projeto Android e Compilar
        shell: bash
        run: |
          # Procura a pasta que contém o settings.gradle ou build.gradle
          PROJECT_DIR=$(find . -name "settings.gradle" -o -name "build.gradle" | grep -v "/build/" | head -n 1 | xargs dirname)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Erro: Projeto Android não encontrado no repositório!"
            exit 1
          fi
          
          echo "Projeto encontrado em: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Gera o gradle wrapper se não existir
          if [ ! -f "./gradlew" ]; then
            echo "Gerando Gradle Wrapper..."
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          
          # Configura gradle.properties com AndroidX e Jetifier
          PROPS_FILE="gradle.properties"
          [ -f "$PROPS_FILE" ] && sed -i '/android.useAndroidX/d' "$PROPS_FILE"
          [ -f "$PROPS_FILE" ] && sed -i '/android.enableJetifier/d' "$PROPS_FILE"
          echo "android.useAndroidX=true" >> "$PROPS_FILE"
          echo "android.enableJetifier=true" >> "$PROPS_FILE"
          
          # Compila o APK de Debug
          ./gradlew assembleDebug
          
          # Salva o caminho para o artefato
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Salvar artefato do APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
