name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Localizar pasta do projeto Android
        id: find-android
        shell: bash
        run: |
          # Procura onde está o arquivo build.gradle ou settings.gradle
          ANDROID_DIR=$(find . -name "settings.gradle" -o -name "build.gradle" | grep -v "build/" | head -n 1 | xargs dirname)
          
          if [ -z "$ANDROID_DIR" ]; then
            echo "Erro: Projeto Android não encontrado!"
            exit 1
          fi
          
          echo "Projeto encontrado em: $ANDROID_DIR"
          echo "android_dir=$ANDROID_DIR" >> $GITHUB_ENV

      - name: Gerar Gradle Wrapper e Configurar Properties
        shell: bash
        run: |
          cd ${{ env.ANDROID_DIR }}
          
          # Gera o gradlew caso não exista
          if [ ! -f "./gradlew" ]; then
            echo "Gerando Gradle Wrapper..."
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          
          # Configura o gradle.properties com AndroidX e Jetifier
          PROPS_FILE="gradle.properties"
          [ -f "$PROPS_FILE" ] && sed -i '/android.useAndroidX/d' "$PROPS_FILE"
          [ -f "$PROPS_FILE" ] && sed -i '/android.enableJetifier/d' "$PROPS_FILE"
          
          echo "android.useAndroidX=true" >> "$PROPS_FILE"
          echo "android.enableJetifier=true" >> "$PROPS_FILE"

      - name: Compilar APK (Debug)
        run: |
          cd ${{ env.ANDROID_DIR }}
          ./gradlew assembleDebug

      - name: Salvar artefato do APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
