name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Encontrar diretório do projeto Android e configurar Gradle
        shell: bash
        run: |
          # Busca onde está o arquivo gradlew no repositório
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Erro: Arquivo gradlew não encontrado no repositório!"
            exit 1
          fi
          
          ANDROID_DIR=$(dirname "$GRADLEW_PATH")
          echo "Projeto Android encontrado em: $ANDROID_DIR"
          
          # Configurar gradle.properties com AndroidX e Jetifier
          PROPS_FILE="$ANDROID_DIR/gradle.properties"
          [ -f "$PROPS_FILE" ] && sed -i '/android.useAndroidX/d' "$PROPS_FILE"
          [ -f "$PROPS_FILE" ] && sed -i '/android.enableJetifier/d' "$PROPS_FILE"
          
          echo "android.useAndroidX=true" >> "$PROPS_FILE"
          echo "android.enableJetifier=true" >> "$PROPS_FILE"
          
          # Salvar o caminho para as próximas etapas
          echo "ANDROID_DIR=$ANDROID_DIR" >> $GITHUB_ENV

      - name: Dar permissão de execução ao Gradle Wrapper
        run: chmod +x ${{ env.ANDROID_DIR }}/gradlew

      - name: Compilar APK (Debug)
        run: |
          cd ${{ env.ANDROID_DIR }}
          ./gradlew assembleDebug

      - name: Salvar artefato do APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
