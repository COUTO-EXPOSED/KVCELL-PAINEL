name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Garantir configuracoes do AndroidX e Jetifier
        shell: bash
        run: |
          PROPS_FILE="android-kvcell-finance-mdm/gradle.properties"
          mkdir -p "android-kvcell-finance-mdm"
          
          # Remove entradas antigas se existirem para evitar duplicidade
          [ -f "$PROPS_FILE" ] && sed -i '/android.useAndroidX/d' "$PROPS_FILE"
          [ -f "$PROPS_FILE" ] && sed -i '/android.enableJetifier/d' "$PROPS_FILE"
          
          # Adiciona as configurações do AndroidX e Jetifier
          echo "android.useAndroidX=true" >> "$PROPS_FILE"
          echo "android.enableJetifier=true" >> "$PROPS_FILE"

          echo "--- Conteúdo do gradle.properties ---"
          cat "$PROPS_FILE"

      - name: Dar permissão de execução ao Gradle Wrapper
        run: chmod +x ./android-kvcell-finance-mdm/gradlew

      - name: Compilar APK (Debug)
        run: |
          cd android-kvcell-finance-mdm
          ./gradlew :app:assembleDebug

      - name: Salvar artefato do APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-kvcell-finance-mdm/app/build/outputs/apk/debug/*.apk
